<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Contact Gabriel Fonseca</title></head>
  <body>
    <!-- Static definition for Netlify Forms; the React form submits here via AJAX. -->
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact">
      <input type="hidden" name="subject" value="New portfolio contact message">
      <input name="bot-field">
      <input name="name" type="text">
      <input name="email" type="email">
      <textarea name="message"></textarea>
    </form>
    <p><a href="/#contato">Contact Gabriel Fonseca</a></p>
  </body>
</html>
